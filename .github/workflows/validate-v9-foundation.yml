name: Validate V9 foundation

on:
  pull_request:
    paths:
      - "v9/**"
      - "v9-shadow-worker.js"
      - "v9-ai-shadow-worker.js"
      - "v9-core-fetch-router.js"
      - "meta-token-store.js"
      - "tests/v9-*.test.js"
      - "start.js"
      - "supabase/migrations/20260729*.sql"
      - ".github/workflows/validate-v9-foundation.yml"
  push:
    branches: [main]
    paths:
      - "v9/**"
      - "v9-shadow-worker.js"
      - "v9-ai-shadow-worker.js"
      - "v9-core-fetch-router.js"
      - "meta-token-store.js"
      - "tests/v9-*.test.js"
      - "start.js"
      - "supabase/migrations/20260729*.sql"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run V9 regression tests
        run: node --test tests/v9-*.test.js
      - name: Validate V9 worker syntax
        run: |
          node --check v9-shadow-worker.js
          node --check v9-ai-shadow-worker.js
          node --check v9-core-fetch-router.js
          node --check meta-token-store.js
      - name: Confirm SHADOW startup wiring
        run: |
          grep -F 'await safeImport("./v9-core-fetch-router.js")' start.js
          grep -F 'startDetached("./v9-shadow-worker.js")' start.js
          grep -F 'startDetached("./v9-ai-shadow-worker.js")' start.js
          grep -F 'mode !== "SHADOW"' v9-shadow-worker.js
          grep -F 'AICAKE_ACTIVE' v9-shadow-worker.js
          grep -F 'should_send: false' v9-ai-shadow-worker.js
          grep -F 'AIGUKA_V9_CORE_SERVICE_ROLE_KEY' v9-core-fetch-router.js
          grep -F 'v9_integrations' meta-token-store.js
          ! grep -F 'graph.facebook.com' v9-ai-shadow-worker.js
      - name: Confirm clean Core constraints
        run: |
          core_files="supabase/migrations/20260729151500_v9_core_clean_foundation.sql supabase/migrations/20260729164000_v9_core_integrations.sql"
          test "$(cat $core_files | grep -c '^create table.*public.v9_')" -eq 18
          test "$(cat $core_files | grep -c '^create or replace function public.v9_')" -eq 1
          ! grep -Eiq '^create trigger|pg_cron|net.http|http_post' $core_files
