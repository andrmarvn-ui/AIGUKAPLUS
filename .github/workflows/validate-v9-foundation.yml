name: Validate V9 foundation

on:
  pull_request:
    paths:
      - "v9/**"
      - "v10/**"
      - "v10-*.js"
      - "v9-shadow-worker.js"
      - "v9-legacy-inbox-bridge.js"
      - "v9-core-fetch-router.js"
      - "v9-core-bridge-bootstrap.js"
      - "v9-reporting-publisher.js"
      - "v9-reporting-sync-worker.js"
      - "supabase/functions/aiguka-v9-webhook/**"
      - "reporting/**"
      - "meta-token-store.js"
      - "tests/v9-*.test.js"
      - "tests/v10-*.test.js"
      - "start.js"
      - "supabase/migrations/20260729*.sql"
      - ".github/workflows/validate-v9-foundation.yml"
  push:
    branches: [main]
    paths:
      - "v9/**"
      - "v10/**"
      - "v10-*.js"
      - "v9-shadow-worker.js"
      - "v9-legacy-inbox-bridge.js"
      - "v9-core-fetch-router.js"
      - "v9-core-bridge-bootstrap.js"
      - "v9-reporting-publisher.js"
      - "v9-reporting-sync-worker.js"
      - "supabase/functions/aiguka-v9-webhook/**"
      - "reporting/**"
      - "meta-token-store.js"
      - "tests/v9-*.test.js"
      - "tests/v10-*.test.js"
      - "start.js"
      - "supabase/migrations/20260729*.sql"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Core and V10 regression tests
        run: |
          node --test tests/v9-*.test.js
          node --test tests/v10-*.test.js
      - name: Validate current worker syntax
        run: |
          node --check v9-core-bridge-bootstrap.js
          node --check v9-legacy-inbox-bridge.js
          node --check v9-core-fetch-router.js
          node --check v9-reporting-publisher.js
          node --check v9-reporting-sync-worker.js
          node --check v9/core/legacy-inbox-normalizer.js
          node --check v9/core/reporting-contract.js
          node --check v10-decision-queue-janitor.js
          node --check v10-direct-core-worker.js
          node --check v10-ai-worker.js
          node --check v10-outbound-worker.js
          node --check v10/core/advisory-engine.js
          node --check v10/core/conversation-assembler.js
          node --check v10/core/decision-contract.js
          node --check v10/core/knowledge-advisor.js
          node --check v10-live-release.js
          node --check meta-token-store.js
          node --check start.js
      - name: Confirm direct Core and V10 startup wiring
        run: |
          grep -F 'await bootstrapV9CoreBridge();' start.js
          grep -F 'await safeImport("./v9-core-fetch-router.js")' start.js
          grep -F 'startDetached("./v9-legacy-inbox-bridge.js")' start.js
          grep -F 'await safeImport("./v10-decision-queue-janitor.js", true)' start.js
          grep -F 'startDetached("./v10-direct-core-worker.js")' start.js
          grep -F 'startDetached("./v10-ai-worker.js")' start.js
          grep -F 'startDetached("./v10-outbound-worker.js")' start.js
          grep -F 'startDetached("./v9-reporting-publisher.js")' start.js
          grep -F 'startDetached("./v9-reporting-sync-worker.js")' start.js
          ! grep -F 'startDetached("./v9-shadow-worker.js")' start.js
          ! grep -F 'startDetached("./v9-direct-core-worker.js")' start.js
          ! grep -F 'startDetached("./v9-ai-shadow-worker.js")' start.js
          ! grep -F 'startDetached("./v9-live-outbound-worker.js")' start.js
          ! grep -F 'v9-live-release-patch.js' start.js
          ! grep -E 'v8_meta_events|v8_messages_raw|v8_customers|v8_message_actor_registry' v10-direct-core-worker.js
          grep -F 'rpc/v9_claim_jobs' v10-direct-core-worker.js
          grep -F 'rpc/v9_ingest_meta_batch' v9-legacy-inbox-bridge.js
          grep -F 'outbound_enabled: false' v9-legacy-inbox-bridge.js
          grep -F 'recoverStaleProcessing' v10-ai-worker.js
          grep -F 'ai_decision_authority: "sole"' v10-ai-worker.js
          grep -F 'advisor_authority: "non_binding"' v10-ai-worker.js
          grep -F 'business_decision_authority: "none"' v10-decision-queue-janitor.js
          grep -F 'business_rules_authority: "none"' v10-outbound-worker.js
          grep -F 'AIGUKA_V9_CORE_SERVICE_ROLE_KEY' v9-core-fetch-router.js
          grep -F 'v9_integrations' meta-token-store.js
          ! grep -F 'graph.facebook.com' v10-ai-worker.js
      - name: Confirm database-only Core bridge safety
        run: |
          grep -F 'rpc/v9_get_core_bridge_bootstrap' v9-core-bridge-bootstrap.js
          grep -F 'x-aiguka-core-bridge' v9-core-bridge-bootstrap.js
          grep -F 'AIGUKA_V9_CORE_AUTH_MODE = "database_bridge"' v9-core-bridge-bootstrap.js
          grep -F 'v9CoreBridgeState.ready === true' start.js
          grep -F 'never a Core service-role key' v9-core-bridge-bootstrap.js
          ! grep -E '[a-f0-9]{96}' v9-core-bridge-bootstrap.js start.js
          ! grep -F 'e3bcdfd89c3a93ffb66e30cb447569eb' v9-core-bridge-bootstrap.js start.js
      - name: Confirm signed Core webhook
        run: |
          webhook="supabase/functions/aiguka-v9-webhook/index.ts"
          grep -F 'META_APP_SECRET' $webhook
          grep -F 'x-hub-signature-256' $webhook
          grep -F 'HMAC' $webhook
          grep -F 'INVALID_META_SIGNATURE' $webhook
          grep -F 'rpc/v9_ingest_meta_batch' $webhook
          grep -F 'decision_eligible' $webhook
          ! grep -F 'graph.facebook.com' $webhook
      - name: Confirm clean Core constraints
        run: |
          core_files="supabase/migrations/20260729151500_v9_core_clean_foundation.sql supabase/migrations/20260729164000_v9_core_integrations.sql supabase/migrations/20260729190000_v9_direct_meta_ingest.sql"
          test "$(cat $core_files | grep -c '^create table.*public.v9_')" -eq 18
          test "$(cat $core_files | grep -c '^create or replace function public.v9_')" -eq 2
          ! grep -Eiq '^create trigger|pg_cron|net.http|http_post' $core_files
          grep -F 'security definer' supabase/migrations/20260729190000_v9_direct_meta_ingest.sql
          grep -F 'on conflict(source_system,source_event_id) do nothing' supabase/migrations/20260729190000_v9_direct_meta_ingest.sql
          grep -F 'revoke all on function public.v9_ingest_meta_batch(jsonb)' supabase/migrations/20260729190000_v9_direct_meta_ingest.sql
      - name: Confirm clean AI Knowledge constraints
        run: |
          knowledge_schema="supabase/migrations/20260729170000_v9_ai_knowledge_clean_schema.sql"
          test "$(grep -c '^create table.*public.ai_' $knowledge_schema)" -eq 9
          test "$(grep -c '^create or replace function public.ai_' $knowledge_schema || true)" -eq 0
          ! grep -Eiq '^create trigger|pg_cron|net.http|http_post' $knowledge_schema
          grep -F "where d.status='published'" supabase/migrations/20260729171000_v9_ai_publish_only_approved_knowledge.sql
          grep -F "'draft'" supabase/migrations/20260729171500_v9_ai_archive_legacy_learning_tables.sql
      - name: Confirm isolated Reporting constraints
        run: |
          reporting_schema="reporting/migrations/20260729180000_v9_reporting_clean_schema.sql"
          test "$(grep -c '^create table public\.' $reporting_schema)" -eq 13
          test "$(grep -c '^create or replace function' $reporting_schema || true)" -eq 0
          ! grep -Eiq '^create trigger|pg_cron|net.http|http_post' $reporting_schema
          ! grep -Eiq '^[[:space:]]*(message_text|contact_value|normalized_value|phone|zalo|token_cipher|api_key)[[:space:]]' $reporting_schema
          grep -F 'v9_reporting_outbox' v9-reporting-publisher.js
          grep -F 'dead_letter' v9-reporting-sync-worker.js
          grep -F 'assertReportingPayloadPrivacy' v9-reporting-publisher.js
          grep -F 'assertReportingPayloadPrivacy' v9-reporting-sync-worker.js
