name: Validate live report cutover

on:
  pull_request:
    paths:
      - "report-handler.js"
      - "dashboard-report-v10-patch.js"
      - "report-v21-worker.js"
      - "tests/report-v21-handler.test.js"
      - "tests/v10-report-tables-live-facts.test.js"
      - "supabase/migrations/20260805152*.sql"
      - ".github/workflows/validate-report-v21-cutover.yml"
  push:
    branches: [main]
    paths:
      - "report-handler.js"
      - "dashboard-report-v10-patch.js"
      - "report-v21-worker.js"
      - "tests/report-v21-handler.test.js"
      - "tests/v10-report-tables-live-facts.test.js"
      - "supabase/migrations/20260805152*.sql"
      - ".github/workflows/validate-report-v21-cutover.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate report runtime syntax
        run: |
          node --check report-handler.js
          node --check report-v21-worker.js
          node --check dashboard-report-v10-patch.js
      - name: Run live report route tests
        run: node --test tests/report-v21-handler.test.js tests/v10-report-tables-live-facts.test.js
      - name: Confirm retired V2.1 cannot reclaim the production route
        run: |
          grep -F 'v8_report_summary_test' report-handler.js
          grep -F 'v8_report_daily_test' report-handler.js
          grep -F 'v8_report_ads_test' report-handler.js
          grep -F 'v8_report_leads_test' report-handler.js
          ! grep -F 'v8_report_summary_v21' report-handler.js
