name: Validate V10 release

on:
  push:
    branches:
      - main
      - fix/v10-release-stabilization-20260805
  pull_request:

permissions:
  contents: read

jobs:
  validate-v10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm install --ignore-scripts

      - name: Run V10 unit tests
        run: node --test tests/v10-*.test.js

      - name: Check V10 runtime syntax
        run: |
          node --check start.js
          node --check v10-live-release.js
          node --check v10-mode-compat-worker.js
          node --check v10-direct-core-worker.js
          node --check v10-customer-profile-worker.js
          node --check v10-ai-worker.js
          node --check v10-ai-worker-final.js
          node --check v10-outbound-worker.js
          node --check v10-decision-queue-janitor.js
          node --check v10/core/decision-contract.js
          node --check v10/core/conversation-assembler.js
          node --check v10/core/knowledge-advisor.js

      - name: Verify committed AI worker matches the historical patch chain
        run: |
          tmp="$(mktemp -d)"
          cp v10-ai-worker-v2.js "$tmp/"
          cp \
            patch-v10-provider-load-balancer.js \
            patch-v10-provider-load-balancer-v4.js \
            patch-v10-provider-load-balancer-v5.js \
            patch-v10-provider-load-balancer-v6.js \
            patch-v10-decision-integrity-v3.js \
            patch-v10-decision-integrity-v4.js \
            patch-v10-decision-integrity-v5.js \
            patch-v10-decision-integrity-v6.js \
            patch-v10-decision-integrity-v7.js \
            patch-v10-decision-integrity-v8.js \
            patch-v10-decision-integrity-v9.js \
            "$tmp/"
          for patch in \
            patch-v10-provider-load-balancer.js \
            patch-v10-provider-load-balancer-v4.js \
            patch-v10-provider-load-balancer-v5.js \
            patch-v10-provider-load-balancer-v6.js \
            patch-v10-decision-integrity-v4.js \
            patch-v10-decision-integrity-v5.js \
            patch-v10-decision-integrity-v6.js \
            patch-v10-decision-integrity-v7.js \
            patch-v10-decision-integrity-v8.js \
            patch-v10-decision-integrity-v9.js
          do
            (cd "$tmp" && node "./$patch")
          done
          node --check "$tmp/v10-ai-worker-v2.js"
          cmp -s "$tmp/v10-ai-worker-v2.js" v10-ai-worker-final.js
          grep -Fq 'providerSettings(provider).max_input_chars' v10-ai-worker-final.js
          grep -Fq 'AIGUKA_V10_DECISION_INTEGRITY_V9' v10-ai-worker-final.js
          grep -Fq 'v10_ai_quality_guard_v12' v10-ai-worker-final.js
          expected="$(sha256sum v10-ai-worker-final.js | awk '{print $1}')"
          test "$expected" = "$(tr -d '\n\r ' < v10-ai-worker-final.sha256)"

      - name: Confirm entrypoint has no runtime source patching
        run: |
          grep -q 'v10-ai-worker-final.js' v10-ai-worker.js
          ! grep -q 'patch-v10-provider-load-balancer' v10-ai-worker.js
          ! grep -q 'patch-v10-decision-integrity' v10-ai-worker.js
          grep -q 'runtime_source_patching: false' v10-ai-worker.js

      - name: Validate production migrations
        run: |
          contact='supabase/migrations/20260805123500_v10_enqueue_new_contact_ack_job.sql'
          metrics='supabase/migrations/20260806193000_v10_direct_customer_report_metrics.sql'
          test -f "$contact"
          grep -q 'after insert on public.v9_contacts' "$contact"
          grep -q "'goal', 'acknowledge_contact'" "$contact"
          grep -q 'on conflict(source_event_id, job_type) do nothing' "$contact"
          test -f "$metrics"
          grep -q 'create or replace function public.v10_report_customer_metrics' "$metrics"
          grep -q 'customer_id <> e.page_id' "$metrics"
          grep -q 'v10_core_live_customer_metrics' "$metrics"

      - name: Confirm retired runtime cannot return
        run: |
          ! grep -q 'startDetached("./v8-v9-mode-sync-worker.js")' start.js
          ! grep -q 'startDetached("./ai-dispatch-worker.js")' start.js
          ! grep -q 'startDetached("./outbound-worker.js")' start.js
          grep -q 'startDetached("./v10-mode-compat-worker.js")' start.js
          test ! -e v7-pancake-service.cjs
          test ! -e patch-v7-pancake-history.js
