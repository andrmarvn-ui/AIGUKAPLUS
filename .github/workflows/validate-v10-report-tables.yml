name: Validate V10 report tables

on:
  pull_request:
  push:
    branches:
      - main
      - fix/v10-report-tables-live-facts-20260805

jobs:
  validate-report-tables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm install --ignore-scripts

      - name: Check report runtime syntax
        run: |
          node --check report-handler.js
          node --check dashboard-ui-patch.js
          node --check dashboard-report-v10-patch.js
          node --check patch-server.js

      - name: Run V10 report table tests
        run: node --test tests/v10-report-tables-live-facts.test.js

      - name: Smoke server patch integration
        run: |
          cp server-fixed.js /tmp/server-fixed.js
          node patch-server.js
          node --check server-fixed.js
          grep -q 'dashboard-report-v10-patch.js' server-fixed.js
          grep -q 'patchV10ReportTablesUi(html)' server-fixed.js
          mv /tmp/server-fixed.js server-fixed.js
