name: Validate runtime patches

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check runtime and patch syntax
        run: |
          node --check start.js
          for file in \
            patch-drive-slide-manager-v2.js \
            patch-catalog-key-rename.js \
            patch-v7-pancake-history.js \
            patch-v7-pancake-toggle.js \
            patch-v7-daily-grouped.js \
            patch-v7-daily-staff-aligned.js \
            patch-v7-daily-runtime-self-contained.js \
            patch-v7-leads-meta-primary.js \
            patch-v7-leads-referral-source.js \
            patch-v7-null-safety.js \
            patch-v7-runtime-integrity.js \
            patch-v7-lead-meta-insights-truth.js \
            patch-v7-lead-reel-old-ad-attribution.js \
            patch-v7-lead-reel-reply-guard.js \
            patch-v7-split-leads-compat.js \
            patch-v7-split-leads-ad-performance.js
          do
            test ! -f "$file" || node --check "$file"
          done

      - name: Validate active legacy patch chains only
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('start.js', 'utf8');
          const chains = [
            [
              'patch-v7-daily-grouped.js',
              'patch-v7-daily-staff-aligned.js',
              'patch-v7-daily-runtime-self-contained.js',
              'patch-v7-leads-meta-primary.js',
              'patch-v7-leads-referral-source.js',
              'patch-v7-null-safety.js',
              'patch-v7-runtime-integrity.js',
              'patch-v7-lead-meta-insights-truth.js',
              'patch-v7-lead-reel-old-ad-attribution.js',
              'patch-v7-lead-reel-reply-guard.js',
              'patch-v7-split-leads-compat.js',
              'patch-v7-split-leads-ad-performance.js',
            ],
          ];
          for (const names of chains) {
            const positions = names.map((name) => source.indexOf(name));
            const present = positions.filter((value) => value >= 0).length;
            if (present === 0) {
              console.log(`Legacy runtime chain retired: ${names[0]}`);
              continue;
            }
            if (present !== names.length) {
              throw new Error(`PARTIAL_LEGACY_RUNTIME_CHAIN:${names.filter((_, i) => positions[i] < 0).join(',')}`);
            }
            for (let i = 1; i < positions.length; i += 1) {
              if (positions[i] <= positions[i - 1]) {
                throw new Error(`INVALID_RUNTIME_PATCH_ORDER:${names[i]}`);
              }
            }
          }
          NODE

      - name: Smoke isolated slide and catalog patches
        run: |
          cp drive-slide-manager.js /tmp/drive-slide-manager.js
          node patch-drive-slide-manager-v2.js
          node --check drive-slide-manager.js
          mv /tmp/drive-slide-manager.js drive-slide-manager.js

          cp public/drive-slides-v8.html /tmp/drive-slides-v8.html
          cp public/drive-slides-v8-render.js /tmp/drive-slides-v8-render.js
          cp src/routes/mappingCenterRoutes.js /tmp/mappingCenterRoutes.js
          node patch-catalog-key-rename.js
          node --check public/drive-slides-v8-render.js
          node --check src/routes/mappingCenterRoutes.js
          mv /tmp/drive-slides-v8.html public/drive-slides-v8.html
          mv /tmp/drive-slides-v8-render.js public/drive-slides-v8-render.js
          mv /tmp/mappingCenterRoutes.js src/routes/mappingCenterRoutes.js
